set -g extended-keys on

set-option -g default-command "reattach-to-user-namespace -l zsh"

set -g base-index 1
set -g display-panes-time 2000
set -g renumber-windows on
set -g mode-keys vi
set -g status-keys vi

set -g status-style bg=#373737

setw -g window-status-format '#[fg=brightblue] #I #W '
setw -g window-status-current-format '#[fg=#37aa37,bold, underscore] #I #W '
setw -g window-status-activity-style bg=black
setw -g window-status-bell-style bg=black

set -g prefix C-x

unbind C-b
unbind M-1
unbind M-2
unbind M-3
unbind M-4
unbind M-5
unbind M-6
unbind M-7
unbind Up
unbind Down
unbind Left
unbind Right
unbind [
unbind ]
unbind \"
unbind \%
unbind c

bind C-c confirm-before -p "Detach from client? (y/n)" detach-client
bind C-x send-prefix
bind Escape copy-mode
bind F5 source-file ~/.tmux.conf

bind d confirm-before -p "kill-window #W? (y/n)" kill-window
bind n new-window
bind p paste-buffer -p
bind s split-window
bind v split-window -h

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

bind -T root C-q kill-pane
bind -T root C-v run "reattach-to-user-namespace pbpaste | tmux load-buffer - && tmux paste-buffer"
